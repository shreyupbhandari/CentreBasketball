name: Daily basketball scrape & analyze

# Runs the full pipeline once a day:
#   LinkGetter -> HTMLGetter -> HeaderGetter -> TableGetter -> getbasketballclean
# then commits any new data back to the repo. Only NEW games are downloaded
# (HTMLGetter skips games whose HTML already exists), and only the CURRENT
# season is processed, so a typical run is a couple of minutes and stays well
# inside the free Actions minutes.

on:
  schedule:
    - cron: "30 9 * * *"      # 09:30 UTC daily (~04:30 US Eastern)
  workflow_dispatch: {}        # adds a manual "Run workflow" button

permissions:
  contents: write              # lets the job push regenerated data back

concurrency:
  group: daily-basketball      # never let two runs overlap / race on git push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest     # Linux = cheapest tier (1x)
    env:
      # main_dir for every script = the checked-out repo root (trailing slash).
      PBP_ROOT: ${{ github.workspace }}/
      SPORTS: mens-basketball,womens-basketball
      # CURRENT SAA members only. Birmingham-Southern (bscsports) closed after
      # 2023-24 and Hendrix (hendrixwarriors) rejoined the SCAC after 2024-25,
      # so we no longer scrape them — see SAA_LAST_SEASON in app.R.
      # Their historical SAA data stays in the repo; games SAA teams played
      # against them still arrive via each SAA team's own scrape.
      # Oglethorpe (gopetrels) is a current member — added once its site
      # migrated to Sidearm so its box scores are scrapeable.
      SCHOOLS: berryvikings,centrecolonels,gomajors,gopetrels,rhodeslynx,sewaneetigers,trinitytigers,southwesternpirates
    steps:
      - uses: actions/checkout@v4

      - name: Compute current basketball season (fall year)
        run: |
          MONTH=$((10#$(date -u +%m)))   # 10# forces base-10 (avoids octal on 08/09)
          YEAR=$(date -u +%Y)
          if [ "$MONTH" -ge 8 ]; then FALL=$YEAR; else FALL=$((YEAR-1)); fi
          echo "START_YEAR=$FALL" >> "$GITHUB_ENV"
          echo "END_YEAR=$FALL"   >> "$GITHUB_ENV"
          echo "Processing season starting fall $FALL"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 1) Discover game links (re-scrapes schedule pages)
        run: python3 "Scraping Files/LinkGetter.py"

      - name: 2) Download NEW game HTML (skips games already on disk)
        run: python3 "Scraping Files/HTMLGetter.py"

      - name: 3) Build header CSVs
        run: python3 "Scraping Files/HeaderGetter.py"

      - name: 4) Build table CSVs
        run: python3 "Scraping Files/TableGetter.py"

      - name: 5) Parse play-by-play into pbp CSVs
        run: python3 getbasketballclean.py

      - name: Commit new data (only if something changed)
        run: |
          git config user.name  "shreyup.bhandari"
          git config user.email "shreyupbhandari@gmail.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new games today — nothing to commit."
          else
            git commit -m "Automated daily basketball refresh ($(date -u +%F))"
            git push
          fi
